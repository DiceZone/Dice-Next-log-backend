<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Dice!Next Log Service</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand">
      <span class="navbar-logo"><img src="/logo.svg" alt="Dice!Next Logo"></span>
      Dice!Next Log Service
      <span class="navbar-version" id="version" hidden></span>
    </a>
  </nav>

  <div class="navbar-log-retention" id="retention" hidden>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"></circle>
      <polyline points="12 6 12 12 16 14"></polyline>
    </svg>
    <span id="retention-text"></span>
  </div>

  <div class="container">
    <p class="description">
      Dice!Next 的跑团日志存储后端服务。
    </p>

    <h2 class="section-title">API 端点</h2>

    <div class="api-list">
      <div class="api-item" data-path="/api/dice/log">
        <div class="api-method method-put">PUT</div>
        <div class="api-details">
          <div class="api-path">/api/dice/log</div>
          <div class="api-description">上传日志文件</div>
          <div class="api-url"></div>
        </div>
        <div class="api-actions"><button class="copy-btn" type="button"></button></div>
      </div>

      <div class="api-item" data-path="/api/dice/w4123">
        <div class="api-method method-post">POST</div>
        <div class="api-details">
          <div class="api-path">/api/dice/w4123</div>
          <div class="api-description">适配 w4123/Dice 的接口，支持txt直接上传</div>
          <div class="api-url"></div>
        </div>
        <div class="api-actions"><button class="copy-btn" type="button"></button></div>
      </div>

      <div class="api-item" data-path="/api/dice/load_data">
        <div class="api-method method-get">GET</div>
        <div class="api-details">
          <div class="api-path">/api/dice/load_data</div>
          <div class="api-description">根据 Key 和 Password 读取日志数据</div>
          <div class="api-url"></div>
        </div>
        <div class="api-actions"><button class="copy-btn" type="button"></button></div>
      </div>

      <div class="api-item" data-path="/api/dice/backup-upload">
        <div class="api-method method-put">PUT</div>
        <div class="api-details">
          <div class="api-path">/api/dice/backup-upload</div>
          <div class="api-description">备用上传接口，用于主存储失败时的级联转发</div>
          <div class="api-url"></div>
        </div>
        <div class="api-actions"><button class="copy-btn" type="button"></button></div>
      </div>

      <div class="api-item" data-path="/api/v2/live/start">
        <div class="api-method method-post">POST</div>
        <div class="api-details">
          <div class="api-path">/api/v2/live/start</div>
          <div class="api-description">实时串流上传接口，需要已绑定的骰娘金钥</div>
          <div class="api-url"></div>
        </div>
        <div class="api-actions"><button class="copy-btn" type="button"></button></div>
      </div>
    </div>

    <div class="footer">
      <a href="https://github.com/DiceZone/Dice-Next-log-backend" class="github-btn" target="_blank" rel="noopener noreferrer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
        </svg>
        源码
      </a>
    </div>
  </div>

  <template id="copy-icon">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
    </svg>
  </template>
  <script src="/index.js"></script>
</body>
</html>
